[pytest]
xfail_strict = true

filterwarnings =
    ignore::ResourceWarning
    ignore::DeprecationWarning
    ignore::urllib3.exceptions.NotOpenSSLWarning

markers =
    smoke: smoke tests
    contract: API contract tests (schema, status codes, auth)
    integration: integration tests (multi-step flows)
    e2e: end-to-end user scenario tests
